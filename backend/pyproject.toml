[project]
name = "leen-ai-backend"
version = "0.1.0"
description = "AI Personal Teacher System — Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.1.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "pillow>=11.0.0",
    "python-multipart>=0.0.20",
    "pgvector>=0.3.6",
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.13",
    "fastembed>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection relies on calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie", "fastapi.File"]
